# Windows exe build for Voltas staff: every version tag (v*) produces a
# single-file voltas-tracker.exe attached to the GitHub release, so the
# handoff is "download one file, double-click" — no Python, no terminal.
name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: pip install . pyinstaller pytest

      - name: Run tests
        run: pytest tests/ -q

      - name: Build voltas-tracker.exe
        run: >
          pyinstaller --onefile --console --name voltas-tracker
          --collect-all rapidfuzz
          packaging/entry.py

      - name: Smoke-test the exe
        run: dist/voltas-tracker.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: voltas-tracker-windows
          path: dist/voltas-tracker.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voltas-tracker.exe
